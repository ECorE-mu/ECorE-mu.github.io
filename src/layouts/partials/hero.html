<div class="masthead ecore-console">
  <div class="console-brand">
    <a class="console-logo-link" href="{{ "/" | relURL }}" aria-label="ECorE home">
      <img class="ecore-hero-logo"
           src="{{ "/assets/brand/ecore-logo.png" | relURL }}"
           alt="ECorE"
           width="260"
           height="260">
    </a>
    <p class="console-kicker">ECorE</p>
    <div class="d-flex flex-wrap gap-2">
      <a class="console-social-link" href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">
        LinkedIn <span aria-hidden="true">↗</span>
      </a>
      <a class="console-social-link" href="{{ .Site.Params.facebook }}" target="_blank" rel="noopener">
        Facebook <span aria-hidden="true">↗</span>
      </a>
      <a class="console-social-link" href="{{ .Site.Params.whatsapp_link }}" target="_blank" rel="noopener" style="border-bottom-color: #25D366; color: #69f0ae;">
        WhatsApp <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
</div>
